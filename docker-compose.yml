services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DATABASE_PATH: /data/bizmind.sqlite3
      VECTOR_PATH: /data/chroma
      UPLOAD_PATH: /data/uploads
    volumes:
      - bizmind_data:/data  web:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api


volumes:
  bizmind_data:
