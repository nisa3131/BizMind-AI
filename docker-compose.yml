services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DATABASE_PATH: /data/bizmind.sqlite3
      VECTOR_PATH: /data/chroma
      UPLOAD_PATH: /data/uploads
    volumes:
      - bizmind_data:/data
volumes:
  bizmind_data:
